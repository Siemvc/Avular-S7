[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
lib_deps = 
	https://github.com/tonton81/FlexCAN_T4.git
	https://github.com/micro-ROS/micro_ros_arduino.git
	micro_ros_arduino@2.0.8-kilted+sha.dc256d6
build_flags = 
	-D MICROROS_TRANSPORT_SERIAL
