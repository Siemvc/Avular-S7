[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
monitor_speed = 115200

lib_deps = 
    https://github.com/micro-ROS/micro_ros_arduino.git
    https://github.com/tonton81/FlexCAN_T4.git

build_flags = 
    -L ./.pio/libdeps/teensy41/micro_ros_arduino/src/cortex-m7/fpv5-d16-hard/
    -l microros